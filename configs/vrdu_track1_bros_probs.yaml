# Track-1 BROS (identical recipe to configs/vrdu_track1_bros.yaml) re-run for study 16 with per-word field
# probabilities saved for the 600 VLM-evaluated documents (results/routing_v3/vrdu_guids.json, written by the notebook).
backbone: bros
dataset: vrdu
data_root: data/vrdu
subcorpus: registration-form

epochs: 20
batch_size: 4
lr: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_length: 512

sliding_window: true
window_size: 384
window_overlap: 128
coordinate_jitter: true
relative_coords: true

seeds: [13, 42]
n_train: 200
save_weights: false
dump_probs: true
dump_probs_guids: results/routing_v3/vrdu_guids.json
output_dir: results/routing_v3/vrdu_bros
