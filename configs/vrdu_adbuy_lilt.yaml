# Track B2 — VRDU Ad-Buy Forms experiment.
#
# MTL vs UTL on VRDU Ad-Buy Forms (DeepForm) with LiLT at matched training-set
# size. Evaluates cross-template generalization on commercial political TV
# advertising broadcast contracts from FCC public inspection files.
#
# Run with:
#   python src/train.py --config configs/vrdu_adbuy_lilt.yaml --protocol matched

backbone: lilt
dataset: vrdu
data_root: data/vrdu          # clone of google-research-datasets/vrdu
subcorpus: ad-buy-form

epochs: 20
batch_size: 4
lr: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_length: 512

seeds: [13, 21, 42]
n_train: 200                  # matched training size for cross-template comparison
output_dir: results/vrdu_adbuy_lilt
