# BROS 2D Relative Positional Attention on VRDU Ad-Buy Forms (DeepForm)
#
# Matched N=200 protocol across MTL (mixed templates) and UTL (held-out stations)
#
# Run with:
#   python src/train.py --config configs/vrdu_adbuy_bros.yaml --protocol matched

backbone: bros
dataset: vrdu
data_root: data/vrdu
subcorpus: ad-buy-form

epochs: 20
batch_size: 4
lr: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_length: 512

seeds: [13, 21, 42]
n_train: 200
output_dir: results/vrdu_adbuy_bros
