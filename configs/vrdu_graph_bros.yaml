# Track B — Graph-BROS: Direction-Agnostic Beta-Skeleton Graph Overlay + LoRA + Differential LR
# Fast-Track Matched Protocol (2 folds x 2 seeds = 4 runs per regime across Dual T4 GPUs)
backbone: bros
dataset: vrdu
data_root: data/vrdu
subcorpus: registration-form
n_train: 200
epochs: 15
batch_size: 4
lr: 0.00005
graph_lr: 0.00025
weight_decay: 0.01
warmup_ratio: 0.1
max_length: 512
seeds: [13, 42]
max_folds: 2
sliding_window: true
window_size: 384
window_overlap: 128
coordinate_jitter: true
jitter_shift: 80
jitter_scale_min: 0.85
jitter_scale_max: 1.15
relative_coords: true
anchor_mode: content_box
use_graph_bros: true
freeze_base: false
lora_r: 16
lora_alpha: 32.0
lora_dropout: 0.05
beta_skeleton: 1.0
graph_eps: 0.01
merge_spans: true
loss_type: ce
focal_gamma: 2.0
gradient_checkpointing: false
save_weights: false
output_dir: results/vrdu_graph_bros
