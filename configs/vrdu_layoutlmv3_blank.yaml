# CONTROL: LayoutLMv3 with a constant image instead of the page (the visual stream switched off); everything else as configs/vrdu_layoutlmv3.yaml.
# Same recipe as configs/vrdu_layoutlmv3.yaml in every other respect (no jitter, no anchoring, matched protocol):
#   python src/train.py --config configs/vrdu_layoutlmv3_blank.yaml --protocol matched
backbone: layoutlmv3
dataset: vrdu
data_root: data/vrdu
subcorpus: registration-form
image_mode: blank

epochs: 20
batch_size: 4
lr: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_length: 512

sliding_window: true
window_size: 384
window_overlap: 128
coordinate_jitter: false
relative_coords: false

seeds: [13, 42]
n_train: 200
save_weights: false
output_dir: results/vrdu_layoutlmv3_blank
