# Track B — the headline experiment.
#
# MTL vs UTL on VRDU Registration Forms with LiLT at matched training-set
# size.  The published calibration is FormNet at 200 docs: MTL 90.51 vs
# UTL 77.29, a 13.22-point gap.  Our gap with LiLT is the number that goes
# on the slide.
#
# Run with:
#   python src/train.py --config configs/vrdu_lilt.yaml --protocol matched

backbone: lilt
dataset: vrdu
data_root: data/vrdu          # clone of google-research-datasets/vrdu
subcorpus: registration-form

epochs: 20
batch_size: 4
lr: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_length: 512

seeds: [13, 21, 42]
n_train: 200                  # match FormNet's published 200-doc condition
output_dir: results/vrdu_lilt

