# Track 1 — Patched LiLT Architecture on VRDU Registration Forms (FARA)
#
# Addresses the 21.08-point generalization gap and 83.3% truncation drop via:
# 1. Multi-page sliding window (384 tokens, 128 overlap) with inference soft voting
# 2. Coordinate jittering (±80 px translation, 0.85-1.15 scale)
# 3. Centroid-relative coordinate injection (centered at 500)
#
# Run with:
#   python src/train.py --config configs/vrdu_track1_lilt.yaml --protocol matched

backbone: lilt
dataset: vrdu
data_root: data/vrdu          # clone of google-research-datasets/vrdu
subcorpus: registration-form

epochs: 20
batch_size: 4
lr: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_length: 512

# Track 1 Enhancements
sliding_window: true
window_size: 384
window_overlap: 128
coordinate_jitter: true
relative_coords: true

seeds: [13, 21, 42]
n_train: 200                  # match FormNet's published 200-doc condition
output_dir: results/vrdu_track1_lilt
